name: TableToTracks
on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]
    paths:
      - 'tracks/tim/7_csv/**'

  # Allows to be run manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

run-name: Convert CSVs for ${{ github.event.head_commit.message }}

jobs:
  # Convert new CSV plane files committed into GPX files
  GeoJsonBuild:
    name: Tables_to_Tracks
    runs-on: macos-latest
    steps:
      - name: Set up Python 3.x
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      #--- Prepare prequisite libraries
      - name: Install GPXpy for gpx transformations
        run: pip install gpxpy
      #--- Checkout using PAT rather than default token, so PagesDeploy/push workflow gets triggered
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_ACTION_PERSONAL_ACCESS_TOKEN }}
      #--- First Step
      - name: Convert CSV files from temporary directory 
        run: |
          echo ">>> Convert all temporary CSV files"
          find tracks/tim/7_csv -type f -name "*.csv" -exec python scripts/csv_to_gpx.py -o tracks/tim/3_gpx/plane {} \;
      #--- Last Step
      - name: Commit converted GPX files
        id: committed
        run: |
          if ! git diff --quiet --exit-code tracks/tim/3_gpx/plane; then
            echo ">>> Converted GPX files to commit"
            # Push the converted GPX files
            git add -f tracks/tim/3_gpx/plane 1>&2
            git status -s 1>&2
            git commit -m "GPXs for øø ${{ github.event.head_commit.message }}" 1>&2
            git push 1>&2
          else
            echo ">>> No converted GPX files to commit"
          fi
